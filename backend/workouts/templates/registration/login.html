<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เข้าสู่ระบบ · Move Daily</title>
    <style>
      body { background: #f4f2ea; color: #192a23; font: 16px system-ui, sans-serif; margin: 0; }
      main { background: white; border-radius: 16px; margin: 10vh auto; max-width: 380px; padding: 28px; }
      label { display: block; font-weight: 600; margin-top: 16px; }
      input { box-sizing: border-box; font: inherit; margin-top: 6px; padding: 11px; width: 100%; }
      button, .register-link { border-radius: 8px; cursor: pointer; display: block; font: inherit; margin-top: 16px; padding: 12px; text-align: center; width: 100%; }
      button { background: #192a23; border: 0; color: white; margin-top: 22px; }
      .register-link { background: white; border: 1px solid #192a23; box-sizing: border-box; color: #192a23; text-decoration: none; }
      .error { color: #a32626; }
    </style>
  </head>
  <body>
    <main>
      <h1>เข้าสู่ระบบ Move Daily</h1>
      <p>ลงชื่อเข้าใช้เพื่ออนุญาตให้แอปเข้าถึงข้อมูลการฝึกของคุณ</p>
      {% for message in messages %}
        <p role="status">{{ message }}</p>
      {% endfor %}
      {% if form.errors %}
        <p class="error" role="alert">อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <label for="{{ form.username.id_for_label }}">อีเมล</label>
        {{ form.username }}
        <label for="{{ form.password.id_for_label }}">รหัสผ่าน</label>
        {{ form.password }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">เข้าสู่ระบบ</button>
      </form>
      <a class="register-link" href="{% url 'register' %}?next={{ next|urlencode }}">สมัครสมาชิก</a>
    </main>
  </body>
</html>
