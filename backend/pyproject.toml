[project]
name = "move-daily-backend"
version = "1.0.0"
description = "Django API and OIDC provider for the Move Daily workout app"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.0,<5.0",
    "django-oidc-provider==0.9.0",
    "dj-database-url>=2.2,<3.0",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.8,<7",
]

[tool.uv]
package = false
