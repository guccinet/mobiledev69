services:
  - type: web
    name: move-daily
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: python manage.py migrate --noinput && python manage.py setup_oidc_client
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: move-daily-db
          property: connectionString
      - key: OIDC_FLUTTER_CLIENT_ID
        value: movedaily-flutter
databases:
  - name: move-daily-db
    databaseName: move_daily
    user: move_daily
    plan: basic-256mb
    region: singapore
